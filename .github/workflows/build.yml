name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack
        run: unzip -q -o "$(ls *.zip | head -n1)" -d work
      - name: Build
        working-directory: work/Alpenglow
        run: gradle --no-daemon assembleRelease
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp work/Alpenglow/app/build/outputs/apk/release/app-release.apk Alpenglow.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Alpenglow.apk --title "Alpenglow" --notes "Install Alpenglow.apk"
